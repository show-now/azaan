[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "infrastructure-risk-system"
version = "0.1.0"
description = "AI-Powered Predictive Analytics and Early Warning System for Infrastructure Project Cost and Time Overruns"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Academic Research Contributor" }
]
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "plotly>=5.20.0",
    "joblib>=1.4.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
